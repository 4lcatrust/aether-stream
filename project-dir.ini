aether-stream/
│   docker-compose.yaml        # full stack: postgres, kafka, connect, schema-registry,
│                              #   flink, clickhouse, minio, prometheus, grafana, ingest
│   README.md                  # project overview, run instructions, endpoints
│   .env                       # local secrets (gitignored)
│   .env.example               # template for .env
│   .gitignore
│   project-dir.ini            # this file
│   pytest.ini                 # pytest config (testpaths, pythonpath, smoke marker)
│
├── .github/
│   └── workflows/
│       └── ci.yml             # GitHub Actions: mvn test + pytest unit on push/PR
│
├── postgres/                  # CDC source schema (loaded into postgres on first start)
│   ├── 01_market_prices.sql
│   └── 02_market_caps.sql
│
├── debezium/                  # Kafka Connect (Debezium) container and connector
│   ├── Dockerfile
│   ├── aether-connector.json  # Postgres -> Kafka connector config (Avro + SR)
│   └── init.sh                # PUTs the connector config to Kafka Connect on startup
│
├── kafka/
│   └── schema_registry/
│       └── validation.sh      # local helper to inspect registered subjects
│
├── flink/
│   ├── base/
│   │   ├── Dockerfile         # aether-flink:1.18-s3 (Flink + s3-fs-hadoop + prom reporter)
│   │   └── Dockerfile.bak
│   └── bronze/                # Java/Maven job: Kafka CDC -> Parquet/MinIO + Kafka Avro + ClickHouse
│       ├── Dockerfile         # multi-stage Maven build (BuildKit .m2 cache mount)
│       ├── pom.xml
│       ├── pom.bak
│       └── src/
│           ├── main/
│           │   ├── avro/
│           │   │   ├── market_price_bronze.avsc
│           │   │   └── market_cap_bronze.avsc
│           │   └── java/com/aetherstream/bronze/
│           │       ├── MarketPriceBronzeJob.java     # main job for market_prices
│           │       ├── MarketCapBronzeJob.java       # main job for market_caps
│           │       ├── sink/
│           │       │   └── ClickHouseHttpSink.java   # batched + retrying, flush on checkpoint
│           │       └── util/
│           │           ├── DebeziumParser.java       # Debezium envelope -> bronze model
│           │           ├── AvroDecimalUtil.java      # BigDecimal <-> Avro bytes (38,18)
│           │           ├── ClickHouseJsonUtil.java   # bronze model -> JSONEachRow
│           │           └── DeadLetterUtil.java       # DLQ JSON payload formatter
│           └── test/java/com/aetherstream/bronze/util/
│               ├── AvroDecimalUtilTest.java
│               ├── ClickHouseJsonUtilTest.java
│               └── DeadLetterUtilTest.java
│
├── clickhouse/                # warehouse (lz / bronze / silver / gold / omt layers)
│   ├── config.d/
│   │   ├── prometheus.xml     # /metrics on :9363
│   │   └── minio.xml          # <s3> endpoint config: MinIO creds from env, no SQL creds
│   └── initdb/
│       └── init.sql           # full schema: lz views, bronze tables, silver MVs,
│                              #   gold facts/dim/semantic, omt monitoring views
│
├── minio/                     # object store (bronze parquet + flink checkpoints/savepoints)
│   └── init.sh                # creates buckets (private; no anonymous access)
│
├── prometheus/
│   └── prometheus.yaml        # scrapes flink, clickhouse, minio, kafka-exporter
│
├── grafana/
│   ├── dashboards/
│   │   └── pipeline-health.json
│   └── provisioning/
│       ├── alerting/
│       │   └── rules.yaml     # in-app alerts: stale lag, sink mismatch,
│       │                      #   dlq arrivals, flink consumer lag
│       ├── dashboards/
│       │   └── dashboards.yaml
│       └── datasources/
│           ├── clickhouse.yaml
│           └── prometheus.yaml
│
├── seed/                      # continuous CoinGecko -> Postgres ingest service
│   ├── Dockerfile
│   ├── requirements.txt
│   └── service_ingest_aether.py
│
└── tests/                     # pytest suite (pytest.ini sets pythonpath=seed)
    ├── requirements.txt
    ├── unit/
    │   └── test_ingest_utils.py        # parse_market_ts + load_db_config
    └── smoke/
        └── test_pipeline_smoke.py      # queries omt views; skips if stack is down
