networks:
  aether-net:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  clickhouse_data:
  clickhouse_logs:
  prometheus_data:
  grafana_data:

services:

  # ============================
  # PostgreSQL (CDC Source)
  # ============================
  postgres:
    image: postgres:15-alpine
    container_name: aether-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    networks:
      - aether-net

  # ============================
  # ClickHouse (Downstream)
  # ============================

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: aether-clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"
      - "9002:9000"
      - "9363:9363"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - aether-net
    healthcheck:
      test:
        - "CMD-SHELL"
        - "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ============================
  # Iceberg
  # ============================
  iceberg-rest:
    image: apache/iceberg-rest-fixture
    container_name: aether-iceberg-rest
    hostname: iceberg-rest
    ports:
      - "8181:8181"
    environment:
          - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
          - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
          - AWS_REGION=us-east-1
          - CATALOG_WAREHOUSE=s3://warehouse/
          - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
          - CATALOG_S3_ENDPOINT=http://minio:9000
    depends_on:
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks:
      - aether-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8181/v1/config >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ============================
  # Zookeeper
  # ============================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: aether-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aether-net

  # ============================
  # Kafka Broker
  # ============================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: aether-kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - aether-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: aether-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Kafka...';
      cub kafka-ready -b kafka:9092 1 30;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic aether_pg.public.market_prices --partitions 1 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic aether_pg.public.market_caps --partitions 1 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic bronze.market_prices.avro --partitions 1 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic bronze.market_caps.avro --partitions 1 --replication-factor 1;
      echo 'Topic ready';
      "
    networks:
      - aether-net

  # ============================
  # Kafka Connect (Debezium)
  # ============================
  kafka-connect:
      build:
        context: ./debezium
        dockerfile: Dockerfile
      container_name: aether-kafka-connect
      hostname: kafka-connect
      depends_on:
        kafka:
          condition: service_healthy
        postgres:
          condition: service_healthy
        schema-registry:
          condition: service_healthy
      ports:
        - "8083:8083"
      environment:
        CONNECT_BOOTSTRAP_SERVERS: kafka:9092
        CONNECT_GROUP_ID: aether-connect
        CONNECT_CONFIG_STORAGE_TOPIC: _connect_configs
        CONNECT_OFFSET_STORAGE_TOPIC: _connect_offsets
        CONNECT_STATUS_STORAGE_TOPIC: _connect_statuses
        CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
        CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
        CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
        CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
        CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
        CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
        CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
        CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
        CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
        CONNECT_CONFIG_PROVIDERS: "env"
        CONNECT_CONFIG_PROVIDERS_ENV_CLASS: "org.apache.kafka.common.config.provider.EnvVarConfigProvider"
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      healthcheck:
        test: ["CMD", "curl", "-fsS", "http://localhost:8083/connectors"]
        interval: 5s
        timeout: 5s
        retries: 30
      networks:
        - aether-net

  # ============================
  # Debezium Connector Init
  # ============================
  connect-init:
    image: curlimages/curl:8.6.0
    container_name: aether-connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./debezium:/debezium:ro
    entrypoint: ["/bin/sh", "/debezium/init.sh"]
    networks:
      - aether-net

  # ============================
  # MinIO (Bronze Delta Lake)
  # ============================
  minio:
    image: minio/minio
    container_name: aether-minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks:
      - aether-net

  minio-init:
    image: minio/mc
    container_name: aether-minio-init
    depends_on:
      - minio
    volumes:
      - ./minio:/minio:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_ENDPOINT: http://minio:9000
    entrypoint: ["/bin/sh", "/minio/init.sh"]
    networks:
      - aether-net

  # ============================
  # Flink Base
  # ============================
  flink-base:
    build:
      context: ./flink/base
      dockerfile: Dockerfile
    image: aether-flink:1.18-s3

  flink-bronze-image:
    build:
      context: ./flink/bronze
      dockerfile: Dockerfile
    image: aether-flink-bronze:latest

  flink-jobmanager:
    image: aether-flink:1.18-s3
    container_name: aether-flink-jobmanager
    hostname: flink-jobmanager
    ports:
      - "8081:8081"
      - "9249:9249"
    command: jobmanager
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        fs.s3a.endpoint: http://minio:9000
        fs.s3a.access.key: ${MINIO_ROOT_USER}
        fs.s3a.secret.key: ${MINIO_ROOT_PASSWORD}
        fs.s3a.path.style.access: true
        fs.s3a.connection.ssl.enabled: false
        state.backend: rocksdb
        state.checkpoints.dir: s3a://flink-checkpoints/bronze-market
        state.savepoints.dir: s3a://flink-savepoints/bronze-market
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.timeout: 5 min
        execution.checkpointing.min-pause: 10s
        execution.checkpointing.tolerable-failed-checkpoints: 3
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 10
        restart-strategy.fixed-delay.delay: 10s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        metrics.reporter.prom.filterLabelValueCharacters: false
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/overview >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - aether-net

  flink-taskmanager:
    image: aether-flink:1.18-s3
    container_name: aether-flink-taskmanager
    hostname: flink-taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        fs.s3a.endpoint: http://minio:9000
        fs.s3a.access.key: ${MINIO_ROOT_USER}
        fs.s3a.secret.key: ${MINIO_ROOT_PASSWORD}
        fs.s3a.path.style.access: true
        fs.s3a.connection.ssl.enabled: false
        state.backend: rocksdb
        state.checkpoints.dir: s3a://flink-checkpoints/bronze-market
        state.savepoints.dir: s3a://flink-savepoints/bronze-market
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
        taskmanager.numberOfTaskSlots: 4
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9250
        metrics.reporter.prom.filterLabelValueCharacters: false
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://flink-jobmanager:8081/taskmanagers >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - aether-net

  # ============================
  # Flink Jobs
  # ============================

  flink-bronze-market-prices:
    image: aether-flink-bronze:latest
    container_name: aether-flink-bronze-market-prices
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      connect-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Submitting Flink job..."
        flink run -d \
          -m flink-jobmanager:8081 \
          -c com.aetherstream.bronze.MarketPriceBronzeJob \
          /opt/flink/jobs/bronze-jobs.jar
        echo "Submitted"
    networks:
      - aether-net

  flink-bronze-market-caps:
    image: aether-flink-bronze:latest
    container_name: aether-flink-bronze-market-caps
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      connect-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Submitting Flink job..."
        flink run -d \
          -m flink-jobmanager:8081 \
          -c com.aetherstream.bronze.MarketCapBronzeJob \
          /opt/flink/jobs/bronze-jobs.jar
        echo "Submitted"
    networks:
      - aether-net

  # ============================
  # Continuous Ingestion Service
  # ============================
  service-ingest-aether:
    build:
      context: ./seed
      dockerfile: Dockerfile
    container_name: aether-ingest
    hostname: ingest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    networks:
      - aether-net

  # ============================
  # Schema Registry
  # ============================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: aether-schema-registry
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    networks:
      - aether-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ============================
  # Prometheus
  # ============================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aether-prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - aether-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ============================
  # Kafka Exporter (consumer lag)
  # ============================
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: aether-kafka-exporter
    hostname: kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - '--kafka.server=kafka:9092'
      - '--web.listen-address=:9308'
    networks:
      - aether-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9308/metrics >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================
  # Grafana
  # ============================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: aether-grafana
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
          GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
          GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
          GF_USERS_ALLOW_SIGN_UP: "false"
          GF_AUTH_ANONYMOUS_ENABLED: "false"
          GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
          CLICKHOUSE_USER: ${CLICKHOUSE_USER}
          CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - aether-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20