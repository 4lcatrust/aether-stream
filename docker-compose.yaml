networks:
  aether-net:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:

services:

  # ============================
  # PostgreSQL (CDC Source)
  # ============================
  postgres:
    image: postgres:15-alpine
    container_name: aether-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    networks:
      - aether-net

  # ============================
  # Zookeeper
  # ============================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: aether-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aether-net

  # ============================
  # Kafka Broker
  # ============================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: aether-kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - aether-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: aether-kafka-init
    depends_on:
      - kafka
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Kafka...';
      cub kafka-ready -b kafka:9092 1 30 &&
      kafka-topics --bootstrap-server kafka:9092
        --create
        --if-not-exists
        --topic aether_pg.public.market_prices
        --partitions 1
        --replication-factor 1
      "
    networks:
      - aether-net


  # ============================
  # Kafka Connect (Debezium)
  # ============================
  kafka-connect:
    image: debezium/connect:2.6
    container_name: aether-kafka-connect
    hostname: kafka-connect
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: aether-connect

      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      PLUGIN_PATH: /kafka/connect,/kafka/connect/debezium
    networks:
      - aether-net

  # ============================
  # Debezium Connector Init
  # ============================
  connect-init:
    image: curlimages/curl:8.6.0
    container_name: aether-connect-init
    depends_on:
      - kafka-connect
    volumes:
      - ./debezium:/debezium:ro
    entrypoint: ["/bin/sh", "/debezium/init.sh"]
    networks:
      - aether-net

  # ============================
  # MinIO (Bronze Delta Lake)
  # ============================
  minio:
    image: minio/minio
    container_name: aether-minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks:
      - aether-net

  minio-init:
    image: minio/mc
    container_name: aether-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/bronze;
      echo 'MinIO buckets ready';
      "
    networks:
      - aether-net


  flink-jobmanager:
    image: aether-flink:1.18-s3
    container_name: aether-flink-jobmanager
    hostname: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        fs.s3a.endpoint: http://minio:9000
        fs.s3a.access.key: minioadmin
        fs.s3a.secret.key: minioadmin
        fs.s3a.path.style.access: true
        fs.s3a.connection.ssl.enabled: false
    networks:
      - aether-net

  flink-taskmanager:
    image: aether-flink:1.18-s3
    container_name: aether-flink-taskmanager
    hostname: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        fs.s3a.endpoint: http://minio:9000
        fs.s3a.access.key: minioadmin
        fs.s3a.secret.key: minioadmin
        fs.s3a.path.style.access: true
        fs.s3a.connection.ssl.enabled: false
        taskmanager.numberOfTaskSlots: 4
    networks:
      - aether-net

  flink-bronze-market-prices:
    build:
      context: ./flink/bronze
      dockerfile: Dockerfile
    image: aether-flink-bronze-market-prices:latest
    container_name: aether-flink-bronze-market-prices
    depends_on:
      - flink-jobmanager
      - kafka
    command: >
      flink run
      -m flink-jobmanager:8081
      -c com.aetherstream.bronze.MarketPriceBronzeJob
      /opt/flink/jobs/market-price-bronze.jar
    volumes:
      - ./data/bronze:/tmp/bronze
    networks:
      - aether-net