apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    uid: aether-clickhouse
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: $CLICKHOUSE_USER
      defaultDatabase: omt
      tlsSkipVerify: true
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
    editable: false