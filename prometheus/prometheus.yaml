global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: aetherstream

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: prometheus
  - job_name: 'flink-jobmanager'
    static_configs:
      - targets: ['flink-jobmanager:9249']
        labels:
          component: flink
          role: jobmanager

  - job_name: 'flink-taskmanager'
    static_configs:
      - targets: ['flink-taskmanager:9250']
        labels:
          component: flink
          role: taskmanager